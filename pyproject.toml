[project]
name = "garden-model"
version = "0.1.0"
description = "Компилятор модели, гейт совместимости и генератор миграций графа требований Garden"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
# pgserver нужен только тестам: он поднимает временный PostgreSQL,
# чтобы миграции проверялись на настоящей СУБД, а не на её подобии.
dev = ["pytest>=8.0", "pgserver>=0.1.4"]

[project.scripts]
garden-model = "garden_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/garden_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
