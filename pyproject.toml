[project]
name = "garden-model"
version = "0.1.0"
description = "Компилятор модели, гейт совместимости и генератор миграций графа требований Garden"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
# pgserver нужен только тестам: он поднимает временный PostgreSQL,
# чтобы миграции проверялись на настоящей СУБД, а не на её подобии.
#
# Версии инструментов проверки закреплены точно, а не нижней границей: иначе вердикт
# на неизменном коде менялся бы вместе с выходом новой версии инструмента, и пайплайн
# краснел бы без единой правки в репозитории. Обновление инструмента — отдельное
# осознанное изменение.
dev = [
    "pytest>=8.0",
    "pgserver>=0.1.4",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
garden-model = "garden_model.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/garden_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень проекта в пути — чтобы помощники тестов импортировались как `tests.conftest`:
# тем же именем, каким их видит проверка типов.
pythonpath = ["tools", "."]

# Ruff закрывает две роли сразу: `ruff format` задаёт оформление, `ruff check` ищет дефекты,
# которые оформлением не исчерпываются. Конфигурация здесь единственная: пайплайн и локальный
# прогон читают её же, дублировать настройки в описании пайплайна нечем и незачем.
[tool.ruff]
line-length = 100
target-version = "py312"
# Выпущенные миграции неизменяемы, а дескрипторы выпущенных версий пишет инструмент:
# ни форматировать, ни линтовать в этих каталогах нечего.
extend-exclude = ["changelog", "model"]

[tool.ruff.lint]
# Правила документирования (`D`) не включены намеренно: docstring'и пишутся по-русски
# по DOC-001 и в форматы pydocstyle не укладываются.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF"]
# RUF001..003 ищут кириллические буквы, похожие на латинские, и рассчитаны на код, где
# текст латинский, а кириллица в нём — случайность. Здесь наоборот: весь текст русский
# по DOC-001, и правила дают 98 находок на словах «строка», «схема», «удаление» — шум,
# в котором настоящая находка потеряется. Отключены конфигурацией, то есть решением
# ревью, а не пометками в коде.
ignore = ["RUF001", "RUF002", "RUF003"]

# Строгий режим целиком: отсутствующая аннотация, несовместимое присваивание и обращение
# к неизвестному атрибуту — ошибки. Пакет лежит в tools/, поэтому корень импортов указан
# явно — тот же, что у pytest в pythonpath.
[tool.mypy]
strict = true
python_version = "3.12"
# Второй корень — каталог раннера: имя `host-runner` содержит дефис и именем пакета быть
# не может, поэтому его файл разрешается как модуль верхнего уровня.
mypy_path = ["tools", "tools/host-runner"]
explicit_package_bases = true
namespace_packages = true
files = ["tools", "tests"]

[[tool.mypy.overrides]]
# Тестовые функции не аннотируются: фикстуры pytest подставляются по имени параметра,
# и аннотация 116 сигнатур дала бы шум без находок. Прочие строгие настройки на тесты
# действуют — несовместимое присваивание в тесте остаётся ошибкой.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Следствие того же послабления: неаннотированный тестовый помощник, вызванный из теста,
# не может считаться ошибкой — иначе снятое требование аннотаций вернулось бы через вызовы.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# pgserver аннотаций не поставляет.
module = "pgserver.*"
ignore_missing_imports = true
