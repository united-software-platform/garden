# Пайплайн контракта модели данных: гейт выпуска версии.
#
# Блокирует слияние на ошибках процесса — версия не повышена, версия понижена, номер выдан
# повторно. Ломающие и разрушающие операции пайплайн не блокирует: решение по ним принимает
# человек в ревью, а в лог они попадают предупреждением.
#
# Тестов здесь нет: их прогоняет пайплайн tests.yml. Одна проверка принадлежит одному
# пайплайну — иначе отказ теста красил бы два статуса и прогонялся бы дважды.
name: model

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5

      - name: Гейт выпуска — ошибки процесса блокируют слияние
        run: |
          if [ -d model/garden.reqs.v1 ]; then
            PYTHONPATH=tools uv run --quiet python -m garden_model diff
          else
            echo "Модель ещё не заполнена — гейт пропущен"
          fi
