# Пайплайн контракта модели данных.
#
# Блокирует слияние на ошибках процесса — версия не повышена, версия понижена, номер выдан
# повторно — и на несобирающейся с нуля схеме. Ломающие и разрушающие операции пайплайн
# не блокирует: решение по ним принимает человек в ревью, а в лог они попадают
# предупреждением.
name: model

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5

      - name: Гейт выпуска — ошибки процесса блокируют слияние
        run: |
          if [ -d model/garden.reqs.v1 ]; then
            PYTHONPATH=tools uv run --quiet python -m garden_model diff
          else
            echo "Модель ещё не заполнена — гейт пропущен"
          fi

      # Тесты поднимают временный PostgreSQL и собирают схему с нуля: проверяется не
      # последний шаг, а то, что вся история миграций укладывается в рабочую схему
      # и совпадает со свёрткой модели.
      - name: Тесты инструментов модели и сборка схемы с нуля
        run: uv run --quiet --extra dev pytest -q
