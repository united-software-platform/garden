    name: placed_by
    from: [ORD]
    to: [CUST]
    from_cardinality: { min: 1, max: 1 }
    description: Заказ размещён покупателем

  - id: 2
    name: belongs_to
    from: [ITEM]
    to: [ORD]
    from_cardinality: { min: 1, max: 1 }
    description: Строка принадлежит заказу

  - id: 3
    name: refers_to
    from: [ITEM]
    to: [PROD]
    from_cardinality: { min: 1, max: 1 }
    description: Строка ссылается на товар

  - id: 4
    name: shipped_by
    from: [ORD]
    to: [SHIP]
    description: Заказ отгружен отправлением

  - id: 5
    name: replaces
    from: [PROD]
    to: [PROD]
    acyclic: true
    description: Товар заменяет снятый с продажи
